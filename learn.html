<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn — Rashid Tagaev</title>
  <meta name="description" content="Private learning roadmap.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5eb5000b">
  <script>
    document.documentElement.classList.add('js');
    try { var t = localStorage.getItem('theme'); if (t && t !== 'violet') document.documentElement.dataset.theme = t; } catch (e) {}
    try { var m = localStorage.getItem('mode'); if (m === 'light' || m === 'dark') document.documentElement.dataset.mode = m; } catch (e) {}
    try { if (localStorage.getItem('privacy') === '1') document.documentElement.classList.add('privacy'); } catch (e) {}
  </script>
</head>
<body data-page="learn" class="admin-page">

<header class="nav scrolled">
  <a href="/" class="logo">rashid<span>_</span></a>
  <nav>
    <a href="/">Home</a>
    <a href="/opportunities">Opportunities</a>
    <a href="/get">Get a file</a>
    <a href="/book">Book a call</a>
    <a class="nav-planner" href="/planner" hidden>Planner</a>
    <a class="nav-planner" href="/learn" aria-current="page" hidden>Learn</a>
    <a class="nav-signin" href="/admin">Sign in</a>
    <button class="mode" type="button" aria-label="Colour mode: system"></button>
    <div class="themes" role="group" aria-label="Colour theme"><button data-t="violet" style="--c:#a78bfa" aria-label="Violet theme"></button><button data-t="ember" style="--c:#ff7a2f" aria-label="Ember theme"></button><button data-t="racing" style="--c:#ff3b47" aria-label="Racing red theme"></button><button data-t="electric" style="--c:#22d3ee" aria-label="Electric cyan theme"></button><button data-t="volt" style="--c:#c6f135" aria-label="Volt lime theme"></button></div>
  </nav>
</header>

<main class="wrap page">
  <section id="rm-gate" class="getbox" hidden>
    <p class="kicker">Learn</p>
    <h1 class="sub-h1">Owner <em>only</em></h1>
    <p class="lead">Sign in to see your learning roadmap.</p>
    <a class="btn" href="/admin">Sign in</a>
  </section>

  <section id="learn" class="planner" hidden>
    <div class="pl-top">
      <div><p class="kicker" id="rm-date"></p><h1 class="sub-h1">Learn</h1></div>
      <div class="pl-actions">
        <button class="btn btn-sm ghost privacy-btn" type="button" data-privacy aria-pressed="false" title="Blur private content until you hover (Shift+P)">👁 Privacy</button>
        <a class="btn btn-sm ghost" href="/planner">Planner</a>
        <button id="rm-mini" class="mini-timer" type="button" title="Pause or resume" hidden></button>
      </div>
    </div>
    <div id="rm-view"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>

<footer class="wrap">
  <span>© 2026 Rashid Tagaev</span>
  <span class="foot-links"><a href="/">Home</a> · <a href="/admin">Admin</a></span>
  <button class="mode" type="button" aria-label="Colour mode: system"></button>
  <div class="themes" role="group" aria-label="Colour theme"><button data-t="violet" style="--c:#a78bfa" aria-label="Violet theme"></button><button data-t="ember" style="--c:#ff7a2f" aria-label="Ember theme"></button><button data-t="racing" style="--c:#ff3b47" aria-label="Racing red theme"></button><button data-t="electric" style="--c:#22d3ee" aria-label="Electric cyan theme"></button><button data-t="volt" style="--c:#c6f135" aria-label="Volt lime theme"></button></div>
</footer>
